<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/duel_h/app/webroot

    <Directory /var/www/duel_h/app/webroot>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
